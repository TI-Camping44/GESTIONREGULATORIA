<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gestión Regulatoria · En mantenimiento</title>
<style>
  :root { --bg: #F4F5F7; --card: #FFFFFF; --ink: #1C2430; --muted: #5B6472; --line: #E3E6EB; --accent: #A61B1B; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12161C; --card: #1B212A; --ink: #E8ECF1; --muted: #A3ACB9; --line: #2A323D; --accent: #E05555; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: var(--bg); color: var(--ink); font-family: Inter, "Segoe UI", Arial, sans-serif; padding: 24px 16px; }
  main { width: 100%; max-width: 520px; background: var(--card); border: 1px solid var(--line); border-radius: 16px;
         padding: 36px 28px; text-align: center; }
  img { width: 96px; height: auto; margin-bottom: 18px; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .06em; color: #fff;
         background: var(--accent); padding: 5px 12px; border-radius: 999px; margin-bottom: 14px; }
  h1 { font-size: 24px; line-height: 1.25; margin: 0 0 12px; }
  p { margin: 0 0 10px; color: var(--muted); font-size: 15px; line-height: 1.55; }
  .foot { margin-top: 18px; font-size: 13px; }
</style>
</head>
<body>
<main>
  <img src="LOGOC44.png" alt="Camping 44">
  <div><span class="tag">EN MANTENIMIENTO</span></div>
  <h1>Tablero de Gestión Regulatoria</h1>
  <p>Estamos actualizando este tablero a una versión nueva. Mientras tanto queda fuera de servicio.</p>
  <p>La planilla de Gestión Regulatoria sigue funcionando con normalidad.</p>
  <p class="foot">Consultas: Área de IT · Camping 44 S.A.</p>
</main>
</body>
</html>
